[build]
  publish = "."

[[headers]]
  for = "audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
